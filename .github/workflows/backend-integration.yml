name: Backend integration tests

on:
  push:
    branches:
      - kerem/qa-ci
  pull_request:
    branches:
      - ayse/recipe-ai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Combined backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add collections branch to integration snapshot
        run: |
          git fetch --no-tags origin backend_work
          git merge --no-commit --no-ff origin/backend_work

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.lock

      - name: Install pinned backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-test.lock
          python -m pip install --disable-pip-version-check --no-deps -e backend

      - name: Run combined backend tests
        run: |
          mkdir -p test-results
          python -m pytest -q backend/tests --junitxml=test-results/backend-tests.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-test-results-${{ github.sha }}
          path: test-results/backend-tests.xml
          if-no-files-found: warn
          retention-days: 14
