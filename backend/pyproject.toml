[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fridgely-collections"
version = "0.5.0"
description = "Sarp Cizer's shopping, favorites and recipe-history backend module"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.1,<1",
    "pydantic>=2.6.4,<3",
    "SQLAlchemy>=2.0.29,<2.1",
    "PyJWT>=2.15.1,<3",
    "argon2-cffi>=25.1,<26",
    "alembic>=1.20.1,<2",
    "httpx>=0.28.1,<1",
    "email-validator>=2.3,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]
serve = ["uvicorn>=0.29,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

